# Settings of tet-web that can change while it runs.
#
# The server reads this file when it starts and again whenever the file
# changes: a new value is in use within a few seconds, without a restart,
# and the log says so (tet-webctl log -f). web/freebsd/install.sh puts the
# file at /usr/local/etc/tet-web.conf once and leaves it alone after that.
#
# A line is NAME=value. A # begins a comment. A name that is left out, or
# has no value, has its default. A file that cannot be read as settings
# changes nothing; the log says why.
#
# A time is a number of seconds, or of minutes, hours or days: 90m, 3h, 2d.

# The longest that one calculation may take. A calculation that runs when
# this changes gets the new limit: raise it to let one finish; lower it and
# the ones that are beyond it stop. One command for it: tet-webctl timeout 6h
TET_WEB_TIMEOUT=6h

# How long a request waits for its result. A calculation that takes longer
# continues: the reply says so, and the same request finds it again.
TET_WEB_WAIT=300

# Calculations at a time. Empty: the number of processors, 4 at least.
# While all of them are busy a new calculation is turned away ("all slots
# are busy calculating; try again later").
TET_WEB_JOBS=

# Threads of one tet (its TET_MT). Empty: one.
TET_WEB_THREADS=2

# The address space that one tet may use, in MiB. Empty: unlimited.
TET_WEB_MEMORY_MB=1024

# The niceness of one tet, 1 to 20, so that the server keeps answering
# while all slots calculate. Empty: that of the server.
TET_WEB_NICE=10
